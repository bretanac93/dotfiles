# Symlinked to ~/.config/tmux/tmux.conf.
#
# Omarchy's stock config is sourced straight from the package rather than copied,
# so improvements from `omarchy update` flow through with no merge to do. This
# file is only the override layer on top of it.
#
# The guard keeps the file usable on machines with no Omarchy installed, where it
# degrades to just the overrides below.

if-shell '[ -r /usr/share/omarchy/config/tmux/tmux.conf ]' \
  'source-file /usr/share/omarchy/config/tmux/tmux.conf'

# ── Prefix ────────────────────────────────────────────────────────────────────
#
# Ctrl-S instead of the stock Ctrl-Space. Ctrl-Space stays on as the secondary
# prefix so Omarchy's docs and its `prefix + ?` keybindings popup still apply.
# This drops the stock Ctrl-B secondary.

set -g prefix C-s
set -g prefix2 C-Space
bind -N "Send prefix" C-s send-prefix

# Note: tmux puts the outer terminal in raw mode, so Ctrl-S reaches tmux rather
# than triggering XON/XOFF flow control. Shells running *inside* tmux still need
# `stty -ixon` to use Ctrl-S themselves — the zsh layer's shell.zsh does that.

# ── vi navigation ─────────────────────────────────────────────────────────────
#
# Stock keeps pane focus/resize on Ctrl-Alt-arrows. These add the hjkl equivalents
# without removing the arrow bindings — both work.

bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R

# -r makes these repeatable: hold the prefix once, then tap H/J/K/L to keep resizing.
bind -N "Resize pane left"  -r H resize-pane -L 5
bind -N "Resize pane down"  -r J resize-pane -D 5
bind -N "Resize pane up"    -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

bind -N "Previous window" -n M-h previous-window
bind -N "Next window"     -n M-l next-window

# Re-home the four bindings the block above displaced. Stock put splits on h/v,
# kill-window on k, kill-session on K, and tmux's own default has last-window on l.
bind -N "Split pane vertically" S split-window -v -c "#{pane_current_path}"
bind -N "Kill window"           X kill-window
bind -N "Kill session"          Q kill-session
bind -N "Last window"         Tab last-window

# ── vi copy mode ──────────────────────────────────────────────────────────────
#
# Stock sets mode-keys vi and binds v/y. These add the rest of the vi motions.
# `y` is deliberately left alone: stock's copy-selection-and-cancel goes through
# `set-clipboard on` (OSC 52), which also works over SSH, unlike piping to wl-copy.

bind -N "Select line"      -T copy-mode-vi V     send -X select-line
bind -N "Rectangle toggle" -T copy-mode-vi C-v   send -X rectangle-toggle
bind -N "Cancel"           -T copy-mode-vi Escape send -X cancel
bind -N "Next word"        -T copy-mode-vi w     send -X next-word
bind -N "Previous word"    -T copy-mode-vi b     send -X previous-word
bind -N "End of word"      -T copy-mode-vi e     send -X next-word-end
bind -N "Copy on drag"     -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
